<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Discovery</title>
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#EEF1F4;--raised:#FAFBFC;
  --ink:#20242B;--ink-soft:#565F6B;--ink-faint:#8A93A0;--line:#E1E5EA;
  --accent:#5B7DAE;--accent-ink:#3E5C82;--accent-soft:#E8EEF5;
  --ok:#4C8B6F;--ok-soft:#E3EFE9;--warn:#9C7A3D;--warn-soft:#F2ECDE;--fail:#B4645A;--fail-soft:#F5E6E3;
  --code-bg:#15181D;--code-ink:#C7CDD5;
  --shadow:0 1px 2px rgba(20,24,31,.06),0 10px 28px -14px rgba(20,24,31,.16);--radius:12px;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171B;--surface:#1B1F25;--surface-2:#232830;--raised:#262B33;--ink:#E7E9ED;--ink-soft:#A8B0BB;--ink-faint:#6E7681;--line:#2C323B;
  --accent:#7C9BC7;--accent-ink:#A9C3E6;--accent-soft:#202A38;--ok:#6EAE8D;--ok-soft:#1C2921;--warn:#C6A264;--warn-soft:#2E2717;--fail:#C97C71;--fail-soft:#2F1F1D;
  --code-bg:#0E1013;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171B;--surface:#1B1F25;--surface-2:#232830;--raised:#262B33;--ink:#E7E9ED;--ink-soft:#A8B0BB;--ink-faint:#6E7681;--line:#2C323B;
  --accent:#7C9BC7;--accent-ink:#A9C3E6;--accent-soft:#202A38;--ok:#6EAE8D;--ok-soft:#1C2921;--warn:#C6A264;--warn-soft:#2E2717;--fail:#C97C71;--fail-soft:#2F1F1D;
  --code-bg:#0E1013;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-inline:16px}
h1,h2,h3{margin:0;text-wrap:balance}
code,.mono{font-family:var(--mono)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
.shell{max-width:1760px;margin:0 auto;padding-block:20px 50px}

.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.mark i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9}
.wordmark{font-weight:700;font-size:1.15rem;letter-spacing:-.01em;line-height:1.1}
.tagline{font-size:.74rem;color:var(--ink-faint)}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta-pill{font:.68rem var(--mono);letter-spacing:.03em;color:var(--ink-faint);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.btn{font-size:.78rem;font-weight:600;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--ink)}

.stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){.stat-strip{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.stat-strip{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-weight:700;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-top:2px}
.stat .sub{font-size:.74rem;color:var(--ink-faint);margin-top:4px}
.stat.ok .n{color:var(--ok)}.stat.warn .n{color:var(--warn)}.stat.fail .n{color:var(--fail)}.stat.accent .n{color:var(--accent-ink)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,input.search{background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px}
select{font-weight:600;cursor:pointer}
select:hover,input.search:hover{border-color:var(--accent)}
input.search{min-width:220px}
.count{font-size:.78rem;color:var(--ink-faint)}
.cap{padding:8px 14px 0;font-size:.74rem;color:var(--ink-faint);line-height:1.45}

.tablewrap{container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table.apps{width:100%;border-collapse:collapse;min-width:1240px}
table.apps thead th{text-align:left;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding:10px 6px;border-bottom:2px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.apps tbody td{padding:11px 6px;border-bottom:1px solid var(--line);font-size:.84rem;vertical-align:middle;position:relative}
tr.row{cursor:pointer}
tr.row:hover td,tr.row.open td{background:var(--accent-soft)}
tr.row td:first-child::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
tr.row.High td:first-child::before{background:var(--ok)}
tr.row.Medium td:first-child::before{background:var(--warn)}
tr.row.Low td:first-child::before{background:var(--fail)}
tbody tr:last-child td{border-bottom:none}
.chev{color:var(--ink-faint);font-size:.7rem;display:inline-block;transition:transform .12s;width:12px}
tr.open .chev{transform:rotate(90deg)}
.appname{font:600 .8rem var(--mono);overflow-wrap:anywhere;display:inline-block;max-width:118px;vertical-align:top}
.sub{font-size:.72rem;color:var(--ink-faint)}
.stack1{font-weight:500}
.bar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden;width:72px}
.bar i{display:block;height:100%}
.bar.High i{background:var(--ok)}.bar.Medium i{background:var(--warn)}.bar.Low i{background:var(--fail)}

.pill{font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.fail{background:var(--fail-soft);color:var(--fail)}.pill.neutral{background:var(--surface-2);color:var(--ink-faint)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:.66rem;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--ok-soft);color:var(--ok)}
.chip.none{background:transparent;color:var(--ink-faint);border:1px dashed var(--line);font-weight:500}

tr.detail td{background:var(--raised);padding:0;max-width:0}
.dwrap{padding:16px 18px 20px;position:sticky;left:0;width:calc(100vw - 80px);width:calc(100cqw - 8px);contain:inline-size}
.dtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dtitle h3{font-size:.95rem;font-weight:600}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-faint);font-size:.8rem;font-weight:600;padding:7px 12px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--accent-ink);border-color:var(--accent)}
.tab .n{font-size:.66rem;background:var(--surface-2);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--ink-soft)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin-top:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.ptitle{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ptitle .pr{text-transform:none;letter-spacing:0;font-weight:500;font-family:var(--mono)}
.outcome{border-radius:8px;padding:10px 12px;font-size:.86rem;display:flex;gap:9px;align-items:flex-start}
.outcome.ok{background:var(--ok-soft);color:var(--ok)}.outcome.warn{background:var(--warn-soft);color:var(--warn)}.outcome.fail{background:var(--fail-soft);color:var(--fail)}.outcome.neutral{background:var(--surface-2);color:var(--ink-soft)}

.fact{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;border-top:1px solid var(--line)}
.fact:first-child{border-top:none}
.ficon{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;margin-top:1px}
.ok .ficon{background:var(--ok-soft);color:var(--ok)}.warn .ficon{background:var(--warn-soft);color:var(--warn)}
.fail .ficon{background:var(--fail-soft);color:var(--fail)}.neutral .ficon{background:var(--surface-2);color:var(--ink-faint)}
.fbody{flex:1;min-width:0}
.flabel{font-size:.82rem;font-weight:600}
.neutral .flabel{font-weight:500;color:var(--ink-soft)}
.fdetail{font-size:.75rem;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere}
.flink{font-size:.72rem;font-weight:700;color:var(--accent-ink);background:none;border:0;cursor:pointer;white-space:nowrap;padding:1px 0}
.flink:hover{text-decoration:underline}
.fright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.logbox{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:9px 11px;font:.72rem/1.55 var(--mono);margin-top:8px;overflow-x:auto}
.logbox .loc{color:#8DB4E8}.logbox div{white-space:pre-wrap;overflow-wrap:anywhere}

.graph{display:flex;align-items:flex-start;overflow-x:auto;padding:18px 16px}
.node{display:flex;flex-direction:column;align-items:center;text-align:center;width:118px;flex:none}
.dot2{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:var(--ink-faint)}
.node.ok .dot2{background:var(--ok);border-color:var(--ok);color:#fff}
.node.fail .dot2{background:var(--fail);border-color:var(--fail);color:#fff}
.node.warn .dot2{background:var(--warn);border-color:var(--warn);color:#fff}
.node.none .dot2{border-style:dashed}
.node.na .dot2{border-style:dotted;opacity:.6}
.nlabel{font-size:.78rem;font-weight:600;margin-top:7px}
.node.none .nlabel,.node.na .nlabel{color:var(--ink-faint);font-weight:500;font-style:italic}
.nsub{font:.66rem var(--mono);color:var(--ink-faint);margin-top:1px;overflow-wrap:anywhere;max-width:108px}
.line{flex:none;width:22px;height:2px;background:var(--line);margin-top:13px}
.line.ok{background:var(--ok)}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:12px 14px}
.kvi{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kvi .l{font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px}
.kvi .v{font:.8rem var(--mono);overflow-wrap:anywhere}
.kvi .cv{display:flex;align-items:center;gap:8px;font:600 .84rem var(--sans)}
.kvi .s{font-size:.72rem;color:var(--ink-faint);margin-top:4px}
.list{margin:0;padding:10px 14px 12px 30px;font-size:.8rem;color:var(--ink-soft)}
.list li{margin:3px 0}
.crit{width:100%;border-collapse:collapse;font-size:.8rem}
.crit th,.crit td{text-align:left;padding:8px 14px;border-top:1px solid var(--line);vertical-align:top}
.crit th{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);border-top:0}
.fid{font:.68rem var(--mono);background:var(--surface-2);border-radius:4px;padding:1px 6px;margin:0 3px 3px 0;display:inline-block;color:var(--ink-soft)}
.empty{text-align:center;padding:50px 20px;color:var(--ink-faint)}
.empty .big{font-weight:700;font-size:1.3rem;color:var(--ink-soft);margin-bottom:4px}
.scroll{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:.82rem}
.dt th{text-align:left;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
.dt tr:nth-child(2) td{border-top:0}
.dt tbody tr:hover td,.dt tr:hover td{background:var(--accent-soft)}
.dt td.k{font-weight:600;white-space:nowrap}
.dt td.v{font-family:var(--mono);font-size:.78rem;overflow-wrap:anywhere}
.dt td.note{color:var(--ink-soft);font-size:.76rem;max-width:380px}
.tag{display:inline-block;font:600 .72rem var(--mono);background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:1px 7px;margin:0 4px 3px 0}
.muted{color:var(--ink-faint)}

.progress{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:12px}
.ptop{display:flex;justify-content:space-between;align-items:baseline}
.plabel{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.pval{font-weight:700;font-size:1.5rem;color:var(--accent-ink)}
.pbar{height:9px;border-radius:5px;background:var(--surface-2);margin:6px 0 10px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft)}.legend span{display:inline-flex;align-items:center;gap:6px}
.ic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex:none;background:var(--surface-2);color:var(--ink-faint);border:2px solid transparent}
.ic.ok{background:var(--ok);color:#fff}.ic.warn{background:var(--warn);color:#fff}.ic.fail{background:var(--fail);color:#fff}
.ic.none{background:transparent;border:2px dashed var(--warn);color:var(--warn)}
.ic.unk{background:transparent;border:2px dotted var(--ink-faint);color:var(--ink-faint)}
.ic.na{background:var(--surface-2);color:var(--ink-faint);opacity:.7}
.ic.sm{width:20px;height:20px;font-size:.68rem}
table.apps th.grp{text-align:center;color:var(--accent-ink);border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 4px}
table.apps th.col{text-align:center;padding:8px 1px;font-size:.54rem;letter-spacing:0}
table.apps td.cell{text-align:center;padding:10px 0;border-left:1px solid var(--line)}
table.apps td.cell.first{border-left:1px solid var(--line)}
.cellsub{font-size:.64rem;color:var(--ink-faint);margin-top:2px}
.ct td.ci{width:34px;padding-right:0}
.ct td.k{white-space:normal;min-width:150px}
.ct td.f{min-width:200px}.ct td.why{color:var(--ink-soft);font-size:.78rem;max-width:420px}
.ct .sub2{font-size:.72rem;color:var(--ink-faint);margin-top:2px}
.nap{padding:10px 14px;font-size:.8rem;color:var(--ink-faint);border-top:1px solid var(--line);background:var(--surface-2)}
.dirty{font-size:.64rem;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:1px 6px}
.cd{font-size:.64rem;letter-spacing:-.01em;white-space:nowrap}
.lowdet{color:var(--warn);font-weight:600}
.lnks{display:flex;gap:6px;margin:4px 0 0 18px}
.about{max-width:760px;font-size:.92rem;line-height:1.6;padding:6px 2px}.about p{margin:0 0 8px}
.ct td.f .cv{display:inline-flex;align-items:center;gap:6px}
.lnk{font-size:.68rem;font-weight:600;color:var(--accent-ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--surface)}
.lnk:hover{border-color:var(--accent)}
.gtitle{font-weight:600}
.dt tr.grprow td{background:var(--surface-2);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="hdr-top">
    <div class="brand"><div class="mark"><i></i></div><div><div class="wordmark">Application Discovery</div><div class="tagline">As-is state of each application, from a static scan</div></div></div>
    <div class="hdr-right"><span class="meta-pill" id="meta"></span><button class="btn" id="theme" type="button">Theme</button></div>
  </div>
  <div class="stat-strip" id="stats"></div>
  <div class="progress"><div class="ptop"><span class="plabel">Average maturity across shown applications</span><span class="pval" id="avg"></span></div><div class="pbar"><i id="avgbar"></i></div><div class="legend" id="legend"></div></div>
</header>
<div class="toolbar">
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search applications…" aria-label="Search applications">
    <select id="fband" aria-label="Maturity filter"><option value="">All maturity</option><option>High</option><option>Medium</option><option>Low</option></select>
    <select id="fcov" aria-label="Coverage filter"><option value="">All coverage states</option></select>
    <select id="sort" aria-label="Sort"><option value="name">Sort: name</option><option value="score">Sort: maturity, lowest first</option></select>
  </div>
  <span class="count" id="count"></span>
</div>
<div class="tablewrap"><table class="apps"><thead id="thead"></thead><tbody id="rows"></tbody></table></div>
</div>
<script id="data" type="application/json">/*__DATA__*/[]</script>
<script>
(function(){
var APPS=JSON.parse(document.getElementById('data').textContent);
var $=function(id){return document.getElementById(id)};
var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
var EXEC={enabled:['Run on every build','ok'],partially_disabled:['Some test commands are skipped','warn'],disabled_in_pipeline:['Skipped in the pipeline','fail'],disabled_in_build:['Switched off in the build file','fail'],unknown_remote_includes:['Cannot tell: the pipeline uses templates held elsewhere','unk'],no_test_command_found:['No test command found in the pipeline','none'],no_ci:['No pipeline found','none']};
var COVL={no_tests:'No tests',tests_present_coverage_not_configured:'No coverage tool',tests_disabled_in_pipeline:'Tests disabled',coverage_configured_not_enforced:'Not enforced',coverage_enforced:'Enforced'};
var IC={MET:['ok','✓','In place'],PARTIAL:['warn','◐','Partly in place'],NOT_MET:['fail','✕','Failing'],NO_EVIDENCE:['none','','Not found or not scanned'],UNKNOWN:['unk','?','Cannot be determined offline'],NA:['na','–','Not applicable']};
var CRIT={automated_build:'Build',version_tagging:'Tag',automated_deploy:'Deploy',unit_tests_exist:'Unit',tests_run_in_ci:'CI run',coverage:'Cover',acceptance_tests:'Accept',performance_tests:'Perf',contract_tests:'Contr.',zero_downtime:'HA',rollback:'Rollback',openapi_exposed:'API',secret_scanning:'Secrets',dependency_scanning:'Libs',sast:'Code',dependency_updates:'Updates',integration_tests:'Integ.',vulnerabilities:'Vulns'};
var FULL={automated_build:'Automated build',version_tagging:'Automated version tagging',automated_deploy:'Automated deploy',unit_tests_exist:'Unit tests exist',tests_run_in_ci:'Tests run in the pipeline',coverage:'Coverage minimum configured and run in the pipeline',acceptance_tests:'Acceptance tests',performance_tests:'Performance tests',contract_tests:'Contract tests',zero_downtime:'Zero-downtime / HA configuration',rollback:'Automatic rollback',openapi_exposed:'API specification (OpenAPI) provided',secret_scanning:'Secret scanning',dependency_scanning:'Dependency (library) scanning',sast:'Code scanning (SAST)',dependency_updates:'Automated dependency updates',integration_tests:'Integration tests',vulnerabilities:'Known vulnerabilities'};
var GROUPS=[['Build & release',['automated_build','version_tagging','automated_deploy']],['Tests',['unit_tests_exist','integration_tests','tests_run_in_ci','coverage','acceptance_tests','performance_tests','contract_tests']],['Operations',['zero_downtime','rollback']],['API',['openapi_exposed']],['Security',['secret_scanning','dependency_scanning','sast','dependency_updates','vulnerabilities']]];
var FIXED=['Application','Type','Language','Framework','Owner','Maturity'];
var NCOL=FIXED.length+GROUPS.reduce(function(n,g){return n+g[1].length},0);
var TABS=[['about','About'],['stack','Stack'],['tests','Tests'],['build','Build & release'],['operations','Operations'],['security','Security'],['notes','Scan info']];
function F(a,id){var p=id.split('.');return (a[p[0]]||{})[p[1]]||{value:null,status:'UNKNOWN',evidence:[]}}
function V(a,id){return F(a,id).value}
